<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="致不清醒的我"><title>致不清醒的我</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;color:#4c4238;background:#f6f2e9}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(#f9f7f1,#f1ecdf)}button,input,textarea{font:inherit}button{cursor:pointer}main{max-width:510px;margin:auto;min-height:100svh;padding:calc(26px + env(safe-area-inset-top)) 22px calc(110px + env(safe-area-inset-bottom));}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:11px;letter-spacing:2.2px;color:#a09280}.brand{font-size:20px}.view{display:none}.view.active{display:block}.home-top{text-align:center;margin:clamp(50px,13vh,112px) auto 44px}.symbol{font-size:36px;color:#a08b76;margin-bottom:22px}.home-top h1{font-family:serif;font-size:32px;letter-spacing:3px;font-weight:500;margin:0 0 18px}.muted{color:#968979;font-size:13px;line-height:1.8}.btn{width:100%;border:1px solid #746657;border-radius:12px;padding:15px;background:#655749;color:white;font-weight:550;margin-top:11px}.btn.secondary{background:transparent;color:#655749;border-color:#c5b8a7}.btn.tiny{width:auto;padding:9px 13px;margin:0;font-size:13px}.card{background:#ede6d9;border-radius:18px;padding:26px 23px;margin:24px 0;box-shadow:0 8px 28px #83746210}.card small{display:block;color:#998977;letter-spacing:1.4px;font-size:11px;margin-bottom:18px}.card h2{font-size:21px;font-weight:550;margin:0 0 15px}.card p{line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.source{text-align:right;color:#8e7f70;font-size:13px;margin-top:22px;overflow-wrap:anywhere}.center{text-align:center}.title-row{display:flex;align-items:center;justify-content:space-between;margin:44px 0 22px;gap:10px}.title-row h1{font-size:27px;letter-spacing:2px;font-family:serif;font-weight:500;margin:8px 0}.count{color:#998d7e;font-size:12px}.entry{border:1px solid #e0d7c9;border-radius:15px;padding:17px;margin:12px 0;background:#fcfaf5}.entry h3{font-size:16px;margin:8px 0}.entry p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;margin:8px 0}.entry .source{margin-top:8px}.entry-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:flex;gap:7px}.ghost{background:transparent;border:0;color:#8a7864;padding:5px 3px;font-size:12px}.field{display:block;font-size:13px;color:#746657;margin:19px 0 7px}input,textarea{display:block;width:100%;border:1px solid #d4c9b8;background:#fffdf9;border-radius:11px;padding:13px;color:#4c4238;outline-color:#a39178}textarea{resize:vertical;min-height:140px;line-height:1.7}.editor{display:none;background:#efe9de;padding:20px;border-radius:17px;margin-bottom:25px}.editor.visible{display:block}.flex{display:flex;gap:9px}.flex>*{flex:1}.empty{color:#9b8c7b;text-align:center;margin:44px 0;line-height:1.8}nav{position:fixed;bottom:0;left:0;right:0;background:#f8f5eded;backdrop-filter:blur(12px);border-top:1px solid #e2d9ca;display:flex;justify-content:center;padding:12px 0 calc(12px + env(safe-area-inset-bottom));gap:65px}nav button{background:none;border:0;color:#9b8d7c;font-size:12px;display:flex;align-items:center;flex-direction:column;gap:5px}nav button.selected{color:#51483e;font-weight:bold}nav .navicon{font-size:21px}.tools{display:flex;gap:8px;margin:24px 0}.tools button{flex:1;background:transparent;color:#796c5d;border:1px solid #d3c8b8;border-radius:9px;padding:10px;font-size:12px}.message{font-size:12px;color:#73634f;min-height:20px}.hint{font-size:12px;line-height:1.7;color:#a09280}.hidden{display:none!important}
</style></head><body><main><header><span class="eyebrow">A LETTER TO MYSELF</span><span class="brand" aria-hidden="true">✦</span></header>
<section id="home" class="view active"><div class="home-top"><div class="symbol">✧</div><h1>致不清醒的我</h1><div class="muted">从过去的自己那里，借一点清醒。</div></div><div id="drawArea" aria-live="polite"><p class="muted center">你的每一条记录，都可以成为未来的一张签。</p></div><button id="drawBtn" class="btn">抽取一张签 ✧</button><button id="toRecords" class="btn secondary">我的记录</button></section>
<section id="records" class="view"><div class="title-row"><div><span class="eyebrow">MY COLLECTION</span><h1>我的记录</h1><div id="count" class="count"></div></div><button id="addBtn" class="btn tiny">＋ 新增</button></div><section id="editor" class="editor"><strong id="editorTitle">新增记录</strong><label class="field" for="titleInput">标题（选填）</label><input id="titleInput" maxlength="140" placeholder="例如：关于情绪"><label class="field" for="bodyInput">想记录的话（必填）</label><textarea id="bodyInput" placeholder="记下今天触动你的那句话……"></textarea><label class="field" for="sourceInput">来源 / 书名（选填）</label><input id="sourceInput" maxlength="160" placeholder="例如：被讨厌的勇气"><p class="hint">只填书名即可，显示时会自动添加《》。新增下一条会保留上次输入的书名。</p><div class="flex"><button id="cancelBtn" class="btn secondary" type="button">取消</button><button id="saveBtn" class="btn" type="button">保存记录</button></div></section><input id="searchInput" aria-label="搜索记录" placeholder="搜索记录或书名……"><div id="entries"></div><div class="tools"><button id="exportBtn">导出备份</button><button id="importBtn">导入备份</button><input class="hidden" type="file" id="importInput" accept="application/json,.json"></div><div id="notice" class="message" role="status"></div><p class="hint center">内容只保存在当前浏览器，请记得定期导出备份。</p></section></main>
<nav aria-label="页面导航"><button id="homeNav" class="selected"><span class="navicon">✧</span>抽签</button><button id="recordsNav"><span class="navicon">▤</span>记录</button></nav>
<script>
(()=>{'use strict';const KEY='letter_to_myself_records_v1',SKEY='letter_to_myself_last_source_v1';let records=[];let editingId=null;let lastDrawId=null;let lastSource='';const el=id=>document.getElementById(id);const safeText=v=>typeof v==='string'?v:'';const cleanSource=s=>safeText(s).trim().replace(/^《|》$/g,'');const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();
try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))records=raw.filter(v=>v&&typeof v.body==='string'&&v.body.trim()).map(v=>({id:safeText(v.id)||uid(),title:safeText(v.title),body:v.body,source:safeText(v.source),createdAt:safeText(v.createdAt)}));lastSource=localStorage.getItem(SKEY)||''}catch(e){alert('本地记录读取失败，请检查浏览器存储。')}function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));localStorage.setItem(SKEY,lastSource);return true}catch(e){alert('保存失败：当前浏览器可能没有可用存储空间。');return false}}
function show(which){el('home').classList.toggle('active',which==='home');el('records').classList.toggle('active',which==='records');el('homeNav').classList.toggle('selected',which==='home');el('recordsNav').classList.toggle('selected',which==='records');if(which==='records')renderRecords();window.scrollTo(0,0)}const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};function showDraw(){const area=el('drawArea');area.replaceChildren();if(!records.length){area.append(node('p','还没有记录。先去写下你的第一句话吧。','empty'));return}const options=records.filter(r=>r.id!==lastDrawId);const pool=options.length?options:records;const r=pool[Math.floor(Math.random()*pool.length)];lastDrawId=r.id;const c=node('article',undefined,'card');c.append(node('small','A LETTER FOR YOU'));if(r.title)c.append(node('h2',r.title));c.append(node('p',r.body));if(r.source)c.append(node('div','——《'+cleanSource(r.source)+'》','source'));area.append(c)}
function openEditor(r){editingId=r?r.id:null;el('editorTitle').textContent=r?'编辑记录':'新增记录';el('titleInput').value=r?r.title:'';el('bodyInput').value=r?r.body:'';el('sourceInput').value=r?cleanSource(r.source):lastSource;el('editor').classList.add('visible');el('editor').scrollIntoView({behavior:'smooth',block:'nearest'});el('titleInput').focus()}function closeEditor(){editingId=null;el('editor').classList.remove('visible')}function save(){const title=el('titleInput').value.trim(),body=el('bodyInput').value.trim(),source=cleanSource(el('sourceInput').value);if(!body){alert('先写一点内容再保存哦。');el('bodyInput').focus();return}const before=records.map(r=>({...r}));const previous=lastSource;if(editingId){const r=records.find(r=>r.id===editingId);if(r)Object.assign(r,{title,body,source})}else records.unshift({id:uid(),title,body,source,createdAt:new Date().toISOString()});lastSource=source;if(!persist()){records=before;lastSource=previous;return}closeEditor();renderRecords();el('notice').textContent='记录已保存。'}
function renderRecords(){const q=el('searchInput').value.trim().toLocaleLowerCase();el('count').textContent='已收藏 '+records.length+' 条思考';const target=el('entries');target.replaceChildren();const filtered=records.filter(r=>(r.title+' '+r.body+' '+r.source).toLocaleLowerCase().includes(q));if(!filtered.length){target.append(node('p',records.length?'没有找到对应的记录。':'还没有记录，写下第一条吧。','empty'));return}for(const r of filtered){const card=node('article',undefined,'entry'),top=node('div',undefined,'entry-top'),date=node('span',r.createdAt?new Date(r.createdAt).toLocaleDateString('zh-CN'):'已保存','count'),actions=node('div',undefined,'actions'),edit=node('button','编辑','ghost'),del=node('button','删除','ghost');edit.addEventListener('click',()=>openEditor(r));del.addEventListener('click',()=>{if(!confirm('确定删除这条记录吗？此操作不能撤销。'))return;const prev=records;records=records.filter(x=>x.id!==r.id);if(!persist()){records=prev;return}if(editingId===r.id)closeEditor();renderRecords()});actions.append(edit,del);top.append(date,actions);card.append(top);if(r.title)card.append(node('h3',r.title));card.append(node('p',r.body));if(r.source)card.append(node('div','——《'+cleanSource(r.source)+'》','source'));target.append(card)}}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'致不清醒的我',version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='私人抽签本备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);el('notice').textContent='备份已准备下载，请妥善保存。'}
async function importBackup(file){if(!file)return;try{if(file.size>5e6)throw Error('文件过大');const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.records))throw Error('不是有效的备份文件');if(data.records.length>10000)throw Error('记录数量过多');const incoming=data.records.map(v=>{if(!v||typeof v.body!=='string'||!v.body.trim())throw Error('备份中有无效记录');return{id:uid(),title:safeText(v.title),body:v.body,source:cleanSource(v.source),createdAt:safeText(v.createdAt)}});if(!confirm('将导入 '+incoming.length+' 条记录，保留已有记录并跳过完全相同的内容。继续吗？'))return;const prev=records;const keys=new Set(records.map(r=>JSON.stringify([r.title,r.body,r.source])));for(const r of incoming){const k=JSON.stringify([r.title,r.body,r.source]);if(!keys.has(k)){records.push(r);keys.add(k)}}if(!persist()){records=prev;return}renderRecords();el('notice').textContent='导入成功。'}catch(e){alert('导入失败：'+e.message)}finally{el('importInput').value=''}}
el('drawBtn').onclick=showDraw;el('toRecords').onclick=()=>show('records');el('homeNav').onclick=()=>show('home');el('recordsNav').onclick=()=>show('records');el('addBtn').onclick=()=>openEditor(null);el('saveBtn').onclick=save;el('cancelBtn').onclick=closeEditor;el('searchInput').oninput=renderRecords;el('exportBtn').onclick=exportBackup;el('importBtn').onclick=()=>el('importInput').click();el('importInput').onchange=e=>importBackup(e.target.files[0]);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
